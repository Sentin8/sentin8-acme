[package]
name = "sentin8-acme"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sentin8/sentin8-acme"
rust-version = "1.85"
description = "Sentin8 Sentin8:Acme - internal ACME certificate authority server."

[[bin]]
name = "sentin8-acme"
path = "src/main.rs"

[lib]
name = "sentin8_acme_server"
path = "src/lib.rs"

[dependencies]
# THE SDK pin (RS 2.3) - the only cross-repo dependency. It carries the
# entire shared library workspace (core/identity/tls/bus/shield/shell +
# every acme-client/contracts SDK crate) behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.21" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
hyper = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
rcgen = "0.13"
rustls = { version = "0.23", features = ["std", "tls12", "logging"], default-features = false }
rustls-graviola = "0.4"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio", "service"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
time = "0.3"
# ES256 JWS signatures for the upstream ACME relay (RFC 8555 §6.2).
p256 = { version = "0.13", features = ["ecdsa"] }
base64ct = { version = "1", features = ["alloc"] }
# Upstream TLS roots (relay rides a hybrid provider; DESIGN §4.2).
rustls-native-certs = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
# Valkey GLIDE - the platform's mandated client engine (group DESIGN.md §3.1).
valkey-glide = "0.9.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
